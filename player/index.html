<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marquee Player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #e6edf3; }
  #stage { position: fixed; inset: 0; }
  #message { position: fixed; inset: 0; display: grid; place-items: center; color: #8b949e; text-align: center; padding: 24px; }
  #message[hidden] { display: none; }
  #message .box { max-width: 36rem; }
  #message button { font: inherit; color: #e6edf3; background: #21262d; border: 1px solid #30363d; border-radius: 6px;
    padding: 10px 14px; margin: 6px; cursor: pointer; text-align: left; min-width: 18rem; }
  #message button:hover { border-color: #8b949e; }
  #overlay {
    position: fixed; left: 12px; bottom: 12px; width: min(34rem, calc(100vw - 24px)); max-height: calc(100vh - 24px); overflow: auto;
    background: rgba(13, 17, 23, .9); border: 1px solid #30363d; border-radius: 8px; padding: 10px 12px; backdrop-filter: blur(6px);
  }
  #overlay[hidden] { display: none; }
  #overlay table { border-collapse: collapse; width: 100%; }
  #overlay td { padding: 1px 0; vertical-align: top; }
  #overlay td:first-child { color: #8b949e; padding-right: 10px; white-space: nowrap; width: 7.5rem; }
  #trace { margin: 8px 0 0; padding: 0; list-style: none; border-top: 1px solid #30363d; }
  #trace li { padding: 3px 0; border-bottom: 1px solid #21262d; }
  #trace .code { color: #58a6ff; }
  #trace .skip .code, #trace .warning .code { color: #d29922; }
  #trace .cut .code, #trace .jump .code { color: #f85149; }
  #trace .t { color: #6e7681; }
  .hint { color: #6e7681; margin-top: 8px; font-size: 11.5px; }
  .warn { color: #d29922; }
  .alert { color: #f85149; }
  .ok { color: #3fb950; }
  #notice { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(210, 153, 34, .92); color: #0d1117;
    padding: 6px 12px; border-radius: 6px; font-weight: 600; }
  #notice[hidden] { display: none; }
</style>
</head>
<body>

<div id="stage"></div>
<div id="message"><div class="box">loading the cartridge…</div></div>
<div id="notice" hidden></div>

<div id="overlay">
  <table id="status"></table>
  <ol id="trace"></ol>
  <div class="hint">O orientation (automatic · landscape · portrait) · M mute · S overlay · F fullscreen · L choose the installation again</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script type="module">
import { CartridgeError, createEngine, filesForLanes, isSqlite, loadCartridge, sqlJsOpener, surfaceClock } from "../engine/dist/index.js";
import { BrowserHost } from "./host.js";
import { MediaStore } from "./media.js";

// The show this player plays. Hard-coded, the way an installed player's
// address effectively is: change these three values and it plays another.
const SOURCE = { base: "../example", projectCode: "SHOW26", surfaceCode: "DEMO1" };

const $ = (id) => document.getElementById(id);
const address = `${SOURCE.projectCode}/${SOURCE.surfaceCode}`;
// §6 — the location is stored per address, so changing the show or surface code
// forgets it; the orientation and the mute are the device's own.
const KEYS = { location: `marquee.location:${address}`, orientation: "marquee.orientation", muted: "marquee.muted" };
const store = {
  get: (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set: (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

const escape = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

function say(html) {
  $("message").hidden = false;
  $("message").innerHTML = `<div class="box">${html}</div>`;
}

async function fetchCartridge(name) {
  const url = `${SOURCE.base}/${SOURCE.projectCode}/${name}`;
  const response = await fetch(url, { cache: "no-store" });
  if (!response.ok) throw new Error(`${url}: HTTP ${response.status}`);
  const bytes = new Uint8Array(await response.arrayBuffer());
  // §8.5 — a 200 is not proof: check the magic before anything else.
  if (!isSqlite(bytes)) throw new Error(`${url} is not a SQLite database (a captive portal's page?)`);
  return bytes;
}

/** §6 — pick an installation: the stored one while the cartridge still lists it, the only one, or ask. */
function provision(snapshot) {
  const locations = snapshot.locations;
  const stored = store.get(KEYS.location);
  const kept = locations.find((l) => l.locationId === stored);
  if (kept) return Promise.resolve(kept);
  if (locations.length === 1) return Promise.resolve(locations[0]);
  if (locations.length === 0) return Promise.resolve(null);
  return new Promise((resolve) => {
    say(`<p>This surface is installed in more than one place. Which one is this?</p>${
      locations.map((l, i) => `<button data-i="${i}">${escape(l.label ?? l.locationId)}<br><span class="hint">${escape(l.locationId)}</span></button>`).join("<br>")}`);
    $("message").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => resolve(locations[Number(b.dataset.i)])));
  });
}

/**
 * §6 — a device's orientation is its own: automatic (the shape of the window
 * this player fills) unless the operator chose landscape or portrait here. A
 * publish never changes it.
 */
const SETTINGS = ["automatic", "landscape", "portrait"];
let setting = SETTINGS.includes(store.get(KEYS.orientation)) ? store.get(KEYS.orientation) : "automatic";
const rendered = () => (setting !== "automatic" ? setting : innerHeight > innerWidth ? "portrait" : "landscape");

(async function boot() {
  let SQL;
  try {
    SQL = await initSqlJs({ locateFile: (f) => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${f}` });
  } catch (error) {
    say(`sql.js did not load: ${escape(error.message)}`);
    return;
  }
  const open = sqlJsOpener(SQL);

  let project, snapshot;
  try {
    // §1 — a surface with a surface code pulls both artifacts.
    project = await loadCartridge(await fetchCartridge("project.db"), { open, kind: "project" });
    snapshot = await loadCartridge(await fetchCartridge(`${SOURCE.surfaceCode}.db`), { open });
  } catch (error) {
    const why = error instanceof CartridgeError ? `${error.message} <span class="hint">(${error.code})</span>` : escape(error.message);
    say(`${why}<br><br><span class="hint">Serve the repository over HTTP: <code>python3 -m http.server</code></span>`);
    console.error(error);
    return;
  }
  for (const w of [...project.warnings, ...snapshot.warnings]) console.warn(`[cartridge] ${w.message}`);

  const location = await provision(snapshot);
  if (location) store.set(KEYS.location, location.locationId);
  let orientation = rendered();

  // §7.7 — fetch by lane: the files the orientation this device renders can show.
  const laneFiles = () => filesForLanes(snapshot, { lanes: [orientation] });
  say("fetching and verifying media…");
  const media = new MediaStore({ base: SOURCE.base, projectCode: SOURCE.projectCode });
  let synced = await media.sync(snapshot, { files: laneFiles(), onProgress: (n, of) => say(`fetching and verifying media… ${n} / ${of}`) });
  $("message").hidden = true;

  // One schedule, whatever the orientation (§5.1). This player does not run the DemoStation
  // mode, so the engine ignores the demo_station slot (§5.11).
  const engine = createEngine({ snapshot, orientation, clock: surfaceClock() });
  const recent = [];
  let lastRender = null;
  let notice = null;
  const host = new BrowserHost({
    engine,
    stage: $("stage"),
    media,
    muted: store.get(KEYS.muted) === true,
    onTrace: (event) => {
      console.info(`[trace] ${engine.venueCalendar.format(event.showTime)} ${event.kind} ${event.code} — ${event.message}`);
      if (event.kind === "render" || event.kind === "blank") lastRender = event;
      recent.unshift(event);
      recent.length = Math.min(recent.length, 8);
    },
    onNotice: (text) => {
      notice = text;
      $("notice").hidden = !text;
      $("notice").textContent = text ?? "";
    },
  });
  host.start();

  /**
   * A change of orientation — the operator's, or the window's shape — applies at once (§5.1):
   * the same playlist carries on from where it was, with the other orientation's files.
   */
  function applyOrientation() {
    const next = rendered();
    if (next === orientation) return;
    orientation = next;
    engine.setOrientation(orientation);   // a cut at the next tick; the cursors are kept
    // §7.7 — the new lane's files; until one is held, its entry is skipped when its turn comes.
    media.sync(snapshot, { files: laneFiles() }).then((s) => { synced = s; });
  }
  addEventListener("resize", () => { if (setting === "automatic") applyOrientation(); });

  // ── keys ────────────────────────────────────────────────────────────────────
  addEventListener("keydown", (e) => {
    const key = e.key.toLowerCase();
    if (key === "o") {
      setting = SETTINGS[(SETTINGS.indexOf(setting) + 1) % SETTINGS.length];
      store.set(KEYS.orientation, setting);
      applyOrientation();
    } else if (key === "m") {
      store.set(KEYS.muted, !host.muted);
      host.setMuted(!host.muted);
    } else if (key === "s") {
      $("overlay").hidden = !$("overlay").hidden;
    } else if (key === "f") {
      document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    } else if (key === "l") {
      store.set(KEYS.location, null);
      window.location.reload();
    }
  });

  // ── status ──────────────────────────────────────────────────────────────────
  const at = (ms) => engine.venueCalendar.format(ms);
  function status() {
    if ($("overlay").hidden) return;
    const v = engine.inspect();
    const rotation = v.workingSet === "takeover"
      ? `<span class="alert">takeover</span> · ${v.rotation.length} ${v.suppressed.length ? `(${v.suppressed.length} standard suppressed)` : ""}`
      : v.workingSet === "standard" ? `standard · ${v.rotation.length}`
      : v.workingSet === "blank" ? `<span class="warn">authored blank</span>`
      : `<span class="warn">${v.workingSet} — the last frame stays</span>`;
    const excluded = v.entries.filter((e) => e.excluded).map((e) => `entry ${e.entryId}: ${escape(e.excluded)}`);
    const failures = media.failures.size ? ` · <span class="alert">${media.failures.size} rejected</span>` : "";
    const sound = host.muted ? "muted (M)" : notice ? `<span class="warn">blocked by the browser — click or press a key</span>` : "on";
    const rows = [
      ["surface", `${escape(snapshot.meta.surfaceId)} · ${escape(snapshot.meta.projectCode)} · revision ${snapshot.meta.publishedRevision}`],
      ["installation", location ? `${escape(location.locationId)} — ${escape(location.label ?? "")}` : `<span class="alert">none in the cartridge</span>`],
      ["orientation", `${orientation} <span class="hint">${setting === "automatic" ? "automatic — the window's shape" : "set on this device"}</span>`],
      ["show clock", `${at(v.showNow)}${lastProjected ? ` <span class="warn">synthetic: Day 1 at the venue's time</span>` : ""}`],
      ["schedule", v.scheduleEntry ? `entry ${v.scheduleEntry.id} from ${at(v.scheduleEntry.timestamp)} → ${v.playlist ? escape(v.playlist.name) : "<span class=warn>no playlist</span>"}` : "nothing yet"],
      ["rotation", rotation],
      ["on screen", lastRender ? escape(lastRender.message) : "—"],
      ["next change", v.interruptAt ? `takeover at ${at(v.interruptAt)}` : v.nextBoundary ? `schedule at ${at(v.nextBoundary)}` : "none scheduled"],
      ["media", `${synced.held} of ${synced.wanted} held and verified for the ${orientation} lane${failures}`],
      ["sound", sound],
    ];
    if (excluded.length) rows.push(["excluded", `<span class="warn">${excluded.join("<br>")}</span>`]);
    $("status").innerHTML = rows.map(([k, val]) => `<tr><td>${k}</td><td>${val}</td></tr>`).join("");
    $("trace").innerHTML = recent.map((e) => `<li class="${e.kind}"><span class="t">${at(e.showTime).slice(11)}</span> <span class="code">${e.code}</span> ${escape(e.message)}</li>`).join("");
  }
  let lastProjected = false;
  host.onTick = (_showNow, projected) => { lastProjected = projected; };
  setInterval(status, 250);
})();
</script>
</body>
</html>
